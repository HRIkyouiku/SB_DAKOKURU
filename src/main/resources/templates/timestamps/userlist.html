<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/layout}">
    <body>
        <main layout:fragment="content">
             <h2>ユーザーごと勤怠一覧</h2>
            <h3>打刻一覧</h3>
            <div>
                <!--検索フォーム-->
                <form th:action="@{/timestamp/userlist/search}" method="post" th:object="${searchForm}">
                    <label>名前</label>
                    <input type="text" th:field="*{searchName}"><br>
                    <label>部署</label>
                    <select th:field="*{departmentId}">
                    <option value="">-- 部署を選択する --</option>
                    <option th:each="department : ${departments}" th:value="${department.id}" th:text="${department.nameJp}"></option>
                    </select>
                    <button type="submit">検索</button>
                </form>
                <!--期間表示-->
                <p th:text="${dateRange}"></p>
                <table border="1">
                    <tr>
                        <th>名前</th>
                        <th>部署</th>
                        <!--日付-->
                        <th th:each="date : ${dateList}" th:text="${date}"></th>
                    </tr>
                    <tr th:each="user : ${users}">
                        <td th:if="${user.name != null}" th:text="${user.name.fnJp + ' ' + user.name.lnJp}"></td>
                        <td>
                            <span th:if="${#lists.isEmpty(user.departments)}">未登録</span>
                            <span th:each="department : ${user.departments}" th:text="${department.nameJp} + ' '"></span>
                        </td>                   
                        <td th:each="date : ${dateList}">勤怠時間</td>
                    </tr>
                </table>
            </div>
        </main>
    </body>
</html>
