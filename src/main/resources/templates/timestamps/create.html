<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/layout}">
    <main layout:fragment="content">
		<head>
			<link rel="stylesheet" th:href="@{/css/timestamps.css}">
		</head>
		<div class="timestamp-container">
			<div class="current-time">
				<div id="date"></div>
				<div id="time"></div>
			</div>
            <form method="post" th:action="@{/timestamp/store}" th:object="${timestampForm}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    
                <select name="workPlaceId" class="workplace">
                    <option th:each="place : ${places}" th:value="${place.id}" th:text="${place.name}"></option>
                </select>
    
				<div>
	                <th:block th:if="${#lists.isEmpty(page.content)}">
	                    <input type="hidden" name="type" value="1">
	                    <button type="submit" class="timestamp-btn">出勤</button>
	                </th:block>
				</div>

                <th:block th:if="${not #lists.isEmpty(page.content)}">
                    <th:block th:switch="${page.content[0].type}">
                        <th:block th:case="4">
                            <input type="hidden" name="type" value="1">
                            <button type="submit" class="timestamp-btn" onclick="return confirm('打刻します。宜しいですか？')">出勤</button>
                        </th:block>
                        <th:block th:case="1">
                            <input type="hidden" name="type" value="2">
                            <button type="submit" class="timestamp-btn" onclick="return confirm('打刻します。宜しいですか？')">休憩開始</button>
                        </th:block>
                        <th:block th:case="2">
                            <input type="hidden" name="type" value="3">
                            <button type="submit" class="timestamp-btn" onclick="return confirm('打刻します。宜しいですか？')">休憩終了</button>
                        </th:block>
                        <th:block th:case="3">
                            <input type="hidden" name="type" value="4">
                            <button type="submit" class="timestamp-btn" onclick="return confirm('打刻します。宜しいですか？')">退勤</button>
                        </th:block>
                        <th:block th:case="*">エラー</th:block>
                    </th:block>
                </th:block>
                <span th:if="${#fields.hasErrors('type')}" th:errors="*{type}" class="error-message"></span>
                <span th:if="${#fields.hasErrors('workPlaceId')}" th:errors="*{workPlace}" class="error-message"></span>
            </form>

	        <div>
	            <span th:if="${successMessage}" th:text="${successMessage}" class="success-message"></span>
	        </div>
			
			<div class="option">
				<button>打刻オプション</button>
			</div>
	
	        <div>
	            <h2 class="timestamp-history">打刻履歴</h2>
	            <table>
	                <tr th:each="timestampHistory : ${page.content}">
	                    <td th:text="${timestampHistory.date}"></td>
	                    <td th:text="${timestampHistory.time}"></td>
	                    <td>
	                        <th:block th:switch="${timestampHistory.type}">
	                            <span th:case="1">出勤</span>
	                            <span th:case="2">休憩開始</span>
	                            <span th:case="3">休憩終了</span>
	                            <span th:case="4">退勤</span>
	                            <span th:case="*">エラー</span>
	                        </th:block>
	                    </td>
	                </tr>
	            </table>
				<div class="page-link">
				    <a th:if="${page.hasPrevious()}"
				       th:href="@{/timestamp/create(page=${page.number - 1}, size=${page.size})}">前へ</a>
	
				   <span th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}">
				       <a th:if="${i != page.number}"
				          th:href="@{/timestamp/create(page=${i}, size=${page.size})}"
				          th:text="${i + 1}"></a>
				       <span th:if="${i == page.number}" th:text="${i + 1}" class="current"></span>
				   </span>
	
				    <a th:if="${page.hasNext()}"
				       th:href="@{/timestamp/create(page=${page.number + 1}, size=${page.size})}">次へ</a>
				</div>
			</div>
        </div>
    </main>
</html>
