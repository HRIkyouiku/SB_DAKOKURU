<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/layout}">
<main layout:fragment="content">
	<h2>
		打刻トップ
		<link rel="stylesheet" th:href="@{/css/timestamp.css}">
	</h2>
	
	<div class="datetime-area">
		<div class="calendar"></div>
		<div class="clock"></div>
	</div>

	<div class="main-card">
		<form class="timestamp-form" method="post" th:action="@{/timestamp/store}" th:object="${timestampForm}">
			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

			<select name="workPlaceId">
				<option th:each="place : ${places}" th:value="${place.id}" th:text="${place.name}"></option>
			</select>

			<th:block th:if="${#lists.isEmpty(timestampHistories)}">
				<input type="hidden" name="type" value="1">
				<button type="submit">出勤</button>
			</th:block>

			<th:block th:if="${not #lists.isEmpty(timestampHistories)}">
				<th:block th:switch="${timestampHistories[0].type}">
					<th:block th:case="4">
						<input type="hidden" name="type" value="1">
						<button class="action-btn work" type="submit">出勤</button>
					</th:block>
					<th:block th:case="1">
						<input type="hidden" name="type" value="2">
						<button class="action-btn break-start" type="submit">休憩開始</button>
					</th:block>
					<th:block th:case="2">
						<input type="hidden" name="type" value="3">
						<button class="action-btn break-end" type="submit">休憩終了</button>
					</th:block>
					<th:block th:case="3">
						<input type="hidden" name="type" value="4">
						<button class="action-btn leave" type="submit">退勤</button>
					</th:block>
					<th:block th:case="*">エラー</th:block>
				</th:block>
			</th:block>
			<span th:if="${#fields.hasErrors('type')}" th:errors="*{type}" class="error-message"></span>
			<span th:if="${#fields.hasErrors('workPlaceId')}" th:errors="*{workPlace}" class="error-message"></span>
		</form>
	</div>


	<div>
		<span class="success-message" th:if="${successMessage}" th:text="${successMessage}"></span>
	</div>


	<div>
		<h2>打刻履歴</h2>
		<table>
			<tr th:each="timestampHistory : ${timestampPage}">
				<td th:text="${timestampHistory.date}"></td>
				<td th:text="${timestampHistory.time}"></td>
				<td>
					<th:block th:switch="${timestampHistory.type}">
						<span th:case="1">出勤</span>
						<span th:case="2">休憩開始</span>
						<span th:case="3">休憩終了</span>
						<span th:case="4">退勤</span>
						<span th:case="*">エラー</span>
					</th:block>
				</td>
			</tr>
		</table>

		<div>
			<ul>
				<li style="display:inline;">
					<span th:if="${timestampPage.first}">&lt;&lt;前</span>
					<a th:if="${!timestampPage.first}" th:href="@{/timestamp/create(page = ${timestampPage.number - 1})}">
						&lt;&lt;前
					</a>
				</li>
				<li th:each="i : ${#numbers.sequence(0, timestampPage.totalPages - 1)}"
					style="display:inline; margin-left:10px;">
					<span th:if="${i} == ${timestampPage.number}" th:text="${i + 1}">1</span>
					<a th:if="${i} != ${timestampPage.number}" th:href="@{/timestamp/create(page = ${i})}">
						<span th:text="${i+1}">1</span>
					</a>
				</li>
				<li style="display:inline; margin-left:10px;">
					<span th:if="${timestampPage.last}">次&gt;&gt;</span>
					<a th:if="${!timestampPage.last}" th:href="@{/timestamp/create(page = ${timestampPage.number + 1})}">
						次&gt;&gt;
					</a>
				</li>
			</ul>
		</div>

	</div>
</main>

</html>
