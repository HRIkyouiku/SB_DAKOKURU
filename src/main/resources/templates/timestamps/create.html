<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/layout}">
    <main layout:fragment="content">
		<head>
			<link rel="stylesheet" th:href="@{/css/timestamps/timestamps.css}">
			<title>timestamps</title>
		</head>
	    <div class="timestamp-container">
			<div class="current-time">
				<div id="date"></div>
				<div id="time"></div>
			</div>
	        <div>
	            <form method="post" th:action="@{/timestamp/store}" th:object="${timestampForm}">
	                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
	    			<div class="timestamp-form">
		                <select name="workPlaceId" class="workplace">
		                    <option th:each="place : ${places}" th:value="${place.id}" th:text="${place.name}"></option>
		                </select>
					</div>
	    
					<div class="timestamp-form">
		                <th:block th:if="${#lists.isEmpty(timestampHistories)}">
		                    <input type="hidden" name="type" value="1">
		                    <button type="submit">出勤</button>
		                </th:block>
		    
		                <th:block th:if="${not #lists.isEmpty(timestampHistories)}">
		                    <th:block th:switch="${timestampHistories[0].type}">
		                        <th:block th:case="4">
		                            <input type="hidden" name="type" value="1">
		                            <button type="submit" class="timestamp-button" onclick="return confirm('打刻します。宜しいですか？')">出勤</button>
		                        </th:block>
		                        <th:block th:case="1">
		                            <input type="hidden" name="type" value="2">
		                            <button type="submit" class="timestamp-button" onclick="return confirm('打刻します。宜しいですか？')">休憩開始</button>
		                        </th:block>
		                        <th:block th:case="2">
		                            <input type="hidden" name="type" value="3">
		                            <button type="submit" class="timestamp-button" onclick="return confirm('打刻します。宜しいですか？')">休憩終了</button>
		                        </th:block>
		                        <th:block th:case="3">
		                            <input type="hidden" name="type" value="4">
		                            <button type="submit" class="timestamp-button" onclick="return confirm('打刻します。宜しいですか？')">退勤</button>
		                        </th:block>
		                        <th:block th:case="*">エラー</th:block>
		                    </th:block>
		                </th:block>
					</div>
	                <span th:if="${#fields.hasErrors('type')}" th:errors="*{type}" class="error-message"></span>
	                <span th:if="${#fields.hasErrors('workPlaceId')}" th:errors="*{workPlace}" class="error-message"></span>
	            </form>
	        </div>
	
	        <div>
	            <span th:if="${successMessage}" th:text="${successMessage}"></span>
	        </div>
	
			<div class="option">
				<button>打刻オプション</button>
			</div>
			
	        <div>
	            <h2>打刻履歴</h2>
	            <table>
	                <tr th:each="timestampHistory : ${timestampHistories}">
	                    <td th:text="${#temporals.format(timestampHistory.date, 'MM/dd')}"></td>
	                    <td th:text="${timestampHistory.time}"></td>
	                    <td>
	                        <th:block th:switch="${timestampHistory.type}">
	                            <span th:case="1">出勤</span>
	                            <span th:case="2">休憩開始</span>
	                            <span th:case="3">休憩終了</span>
	                            <span th:case="4">退勤</span>
	                            <span th:case="*">エラー</span>
	                        </th:block>
	                    </td>
	                </tr>
	            </table>
	        </div>
    </main>
</html>
