<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <meta charset="UTF-8">
    <title>新規部署登録</title>
</head>

<body>
    <div layout:fragment="content">
        <h2>新規部署登録</h2>
        <form th:action="@{/department/store}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <label for="nameJp">作成する部署名</label>
            <input type="text" id="nameJp" name="nameJp" placeholder="新しい部署名" required><br>
            <label for="nameEn">部署名(英語)</label>
            <input type="text" id="nameEn" name="nameEn" placeholder="新しい部署名(英語)" required><br>
            <input type="submit" value="登録">
        </form>
        <a th:href="@{/department/index}">部署一覧へ戻る</a>
    </div>

</body>
</html>
