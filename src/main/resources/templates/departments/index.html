<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <meta charset="UTF-8">
    <title>部署一覧</title>
</head>
<body>
      <div layout:fragment="content">
          <h2>部署一覧</h2>
          <!-- 検索フォーム -->
          <form th:action="@{/department/index}" method="get">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
              <label for="keyword">キーワード</label>
              <input type="text" id="keyword" name="keyword" placeholder="検索したい部署名を入力" th:value="${keyword}">
              <!-- 検索ボタン -->
              <input type="submit" value="検索">
              <!-- クリアボタン -->
              <button type="button" onclick="location.href='/department/index'">クリア</button>
          </form>
          <!-- 新規部署登録画面へのリンク -->
          <a th:href="@{/department/create}" class="btn-new-department">部署新規追加</a>
          
          <hr>
          
          <!-- 検索結果 ◯件 -->
          <p th:text="|検索結果：${#lists.size(departments)}件|"></p>
          
          <div class="departmet-list">
              <div th:each="department : ${departments}" class="department-item">
                  <p th:text="${department.nameJp}"></p>
                  <!-- 部署名 各編集ボタン -->
                  <a th:href="@{/department/edit/{id}(id=${department.id})}" class="edit-button">編集</a>
              </div>
          </div>

</body>
</html>
