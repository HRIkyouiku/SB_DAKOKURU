<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <meta charset="UTF-8">
    <title>部署編集・削除</title>
</head>

<body>
    <div layout:fragment="content">
        <h2>部署編集・削除</h2>       

        <!-- 編集フォーム -->
        <form th:action="@{/department/update}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="hidden" name="id" th:value="${department.id}" />
            <!-- 変更前の部署名を表示 -->
            <label>変更前</label>
            <input type="text" th:value="${department.nameJp}" class="readonly-box" disabled>
            <input type="text" th:value="${department.nameEn}" class="readonly-box" disabled>
            <!-- 変更する部署名を入力するフォーム -->
            <label for="nameJp">変更後</label>
            <input type="text" id="nameJp" name="nameJp" placeholder="新しい部署名" required><br>
            <!-- 変更する部署名を入力するフォーム(英語) -->
            <label for="nameEn">変更後(英語)</label>
            <input type="text" id="nameEn" name="nameEn" placeholder="新しい部署名(英語)" required><br>
            <!-- 変更ボタン -->
            <div class="button-group">
                <input type="submit" value="変更">
            </div>

        </form>
        
        <!-- 削除ボタン -->
        <form th:action="@{/department/delete/{id}(id=${department.id})}" method="post" class="inline-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="submit" value="削除" onclick="return confirm('本当に削除しますか？');">
        </form>
            
        <a th:href="@{/department/index}">部署一覧へ戻る</a>
    </div>

</body>
</html>
