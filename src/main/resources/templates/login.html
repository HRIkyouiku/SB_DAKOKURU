<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Spring Security Example </title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
	<div class="header-container">
		<img th:src="@{/images/DAKOKURU.jpg}" alt="ロゴ" width="150">
		<h1>DAKOKURU</h1>
	</div>
	<div class="error-message" th:if="${errorMessage}">
		<p th:text="${errorMessage}"></p>
	</div>
	<form class="login-form" th:action="@{/login}" method="post">
		<div>
			<label><input type="text" name="employee_no" placeholder="社員番号" /></label>
		</div>
		<div>
			<label><input type="password" name="password" placeholder="パスワード" /></label>
		</div>
		<div>
			<input type="submit" value="Log-In" style="text-align: left;background-color:#4d4d4d; color:#ffffff"/>
		</div>
	</form>
</body>

</html>
