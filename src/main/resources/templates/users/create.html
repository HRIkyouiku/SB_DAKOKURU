<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/layout}">
	<head>
		<link rel="stylesheet" th:href="@{/css/user.css}">
	</head>
	<main layout:fragment="content">
        <h2>Dakoku-Ru</h2>
		<div>
			<p class="required">※は必須項目です。</p>
		</div>
        <div>
            <form method="post" th:action="@{/user/store}" th:object="${userForm}">
                <div>
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
					<div class="container">
						<div class="name-container">
		    				<div>
			                    <label for="fn_jp"><span class="required">※</span>名前(正式表示)</label>
			                    <input id="fn_jp" type="text" name="fnJp" th:value="*{fnJp}">
			                    <div th:if="${#fields.hasErrors('fnJp')}" th:errors="*{fnJp}" class="error-message"></div>
		    				</div>
							
							<div>
			                    <label for=" fn_jp_hira"><span class="required">※</span>名前(ひらがな)</label>
			                    <input id="fn_jp_hira" type="text" name="fnJpHira" th:value="*{fnJpHira}">
			                    <div th:if="${#fields.hasErrors('fnJpHira')}" th:errors="*{fnJpHira}" class="error-message"></div>
							</div>
							
							<div>
			                    <label for="fn_jp_kata"><span class="required">※</span>名前(カタカナ)</label>
			                    <input id="fn_jp_kata" type="text" name="fnJpKata" th:value="*{fnJpKata}">
			                    <div th:if="${#fields.hasErrors('fnJpKata')}" th:errors="*{fnJpKata}" class="error-message"></div>
							</div>
							
							<div>
			                    <label for="fn_en"><span class="required">※</span>名前(英語)</label>
			                    <input id="fn_en" type="text" name="fnEn" th:value="*{fnEn}">
			                    <div th:if="${#fields.hasErrors('fnEn')}" th:errors="*{fnEn}" class="error-message"></div>
							</div>
						</div>
						
						<div class="lastname-container">
							<div>
			                    <label for="ln_jp"><span class="required">※</span>姓(正式表示)</label>
			                    <input id="ln_jp" type="text" name="lnJp" th:value="*{lnJp}">
			                    <div th:if="${#fields.hasErrors('lnJp')}" th:errors="*{lnJp}" class="error-message"></div>
							</div>
							
							<div>
			                    <label for="ln_jp_hira"><span class="required">※</span>姓(ひらがな)</label>
			                    <input id="ln_jp_hira" type="text" name="lnJpHira" th:value="*{lnJpHira}">
			                    <div th:if="${#fields.hasErrors('lnJpHira')}" th:errors="*{lnJpHira}" class="error-message"></div>
							</div>
							
							<div>
			                    <label for="ln_jp_kata"><span class="required">※</span>姓(カタカナ)</label>
			                    <input id="ln_jp_kata" type="text" name="lnJpKata" th:value="*{lnJpKata}">
			                    <div th:if="${#fields.hasErrors('lnJpKata')}" th:errors="*{lnJpKata}" class="error-message"></div>
							</div>
								
							<div>
			                    <label for="ln_en"><span class="required">※</span>姓(英語)</label>
			                    <input id="ln_en" type="text" name="lnEn" th:value="*{lnEn}">
			                    <div th:if="${#fields.hasErrors('lnEn')}" th:errors="*{lnEn}" class="error-message"></div>
							</div>
						</div>
	
						<div class="oldname-container">
							<div>
			                    <label for="oln_jp">旧姓(正式表示)</label>
			                    <input id="oln_jp" type="text" name="olnJp" th:value="*{olnJp}">
			                    <div th:if="${#fields.hasErrors('olnJp')}" th:errors="*{olnJp}" class="error-message"></div>
							</div>
								
							<div>
			                    <label for="oln_jp_hira">旧姓(ひらがな)</label>
			                    <input id="oln_jp_hira" type="text" name="olnJpHira" th:value="*{olnJpHira}">
			                    <div th:if="${#fields.hasErrors('olnJpHira')}" th:errors="*{olnJpHira}"
			                        class="error-message"></div>
							</div>
									
							<div>
			                    <label for="oln_jp_kata">旧姓(カタカナ)</label>
			                    <input id="oln_jp_kata" type="text" name="olnJpKata" th:value="*{olnJpKata}">
			                    <div th:if="${#fields.hasErrors('olnJpKata')}" th:errors="*{olnJpKata}" class="error-message"></div>
							</div>
								
							<div>
			                    <label for="oln_en">旧姓(英語)</label>
			                    <input id="oln_en" type="text" name="olnEn" th:value="*{olnEn}">
			                    <div th:if="${#fields.hasErrors('olnEn')}" th:errors="*{olnEn}" class="error-message"></div>
							</div>
							
							<div>
	                    		<div th:if="${#fields.hasErrors('oldNameValid')}" th:errors="*{oldNameValid}" class="error-message"></div>
							</div>
						</div>
	
						<div class="middlename-container">
							<div>
			                    <label for="mn_jp">ミドルネーム(正式表示)</label>
			                    <input id="mn_jp" type="text" name="mnJp" th:value="*{mnJp}">
			                    <div th:if="${#fields.hasErrors('mnJp')}" th:errors="*{mnJp}" class="error-message"></div>
							</div>
								
							<div>
			                    <label for="mn_jp_hira">ミドルネーム(ひらがな)</label>
			                    <input id="mn_jp_hira" type="text" name="mnJpHira" th:value="*{mnJpHira}">
			                    <div th:if="${#fields.hasErrors('mnJpHira')}" th:errors="*{mnJpHira}" class="error-message"></div>
							</div>
								
							<div>
			                    <label for="mn_jp_kata">ミドルネーム(カタカナ)</label>
			                    <input id="mn_jp_kata" type="text" name="mnJpKata" th:value="*{mnJpKata}">
			                    <div th:if="${#fields.hasErrors('mnJpKata')}" th:errors="*{mnJpKata}" class="error-message"></div>
							</div>
								
							<div>
			                    <label for="mn_en">ミドルネーム(英語)</label>
			                    <input id="mn_en" type="text" name="mnEn" th:value="*{mnEn}">
			                    <div th:if="${#fields.hasErrors('mnEn')}" th:errors="*{mnEn}" class="error-message"></div>
							</div>
	                    
							<div>	
								<div th:if="${#fields.hasErrors('middleNameValid')}" th:errors="*{middleNameValid}" class="error-message"></div>
							</div>
						</div>
	
						<div class="information-container">
							<div>
			                    <label for="email"><span class="required">※</span>メールアドレス</label>
			                    <input id="email" type="email" name="email" th:value="*{email}">
			                    <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error-message"></div>
							</div>
								
							<div>
			                    <label for="password"><span class="required">※</span>パスワード</label>
			                    <input id="password" type="password" name="password">
			                    <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error-message"></div>
							</div>
								
							<div>
			                    <label for="employee_no"><span class="required">※</span>社員番号</label>
			                    <input id="employee_no" type="number" name="employeeNo" th:value="*{employeeNo}">
			                    <div th:if="${#fields.hasErrors('employeeNo')}" th:errors="*{employeeNo}"
			                        class="error-message"></div>
							</div>
									
							<div>
			                    <label for="joining_date"><span class="required">※</span>入社日</label>
			                    <input id="joining_date" type="date" name="joiningDate" th:value="*{joiningDate}">
			                    <div th:if="${#fields.hasErrors('joiningDate')}" th:errors="*{joiningDate}" class="error-message"></div>
							</div>
						</div>
					</div>		
	                <div>
	                    <label for="display_first_name">ファーストネームを先に表示</label>
	                    <input id="display_first_name" type="checkbox" name="englishNotation"
	                            value="true" th:checked="*{englishNotation}">
	                </div>

                    <input type="submit" value="登録">
                </div>
                <div>
                    <span th:if="${successMessage}" th:text="${successMessage}"></span>
                </div>
            </form>
            <a th:href="@{/user/index}" class="cancel">キャンセル</a>
        </div>
    </main>
</html>
