<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/layout}">
    <main layout:fragment="content">
        <h2>新規部署登録</h2>
        <form id="createForm" method="post" th:action="@{/department/store}" th:object="${DepartmentForm}">
            <div>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <label for="name">作成する部署名</label>
                <input id="name_jp" type="text" name="name_jp" th:value="*{name_jp}">
                <span th:if="${#fields.hasErrors('name_jp')}" th:errors="*{name_jp}" class="error-message"></span>
            </div>
			<div>
			    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
			    <label for="name">部署名(英語)</label>
			    <input id="name_en" type="text" name="name_en" th:value="*{name_en}">
			    <span th:if="${#fields.hasErrors('name_en')}" th:errors="*{name_en}" class="error-message"></span>
			</div>
            <div>
                <input type="button" value="登録" onclick="openModal()">
            </div>
            <div>
                <span th:if="${successMessage}" th:text="${successMessage}"></span>
            </div>
			<div>
			  <a th:href="@{/department/index}">部署一覧へ戻る</a>
			</div>
        </form>
		    <div id="modalOverlay" style="
		        display:none;
		        position: fixed;
		        top: 0; left: 0;
		        width: 100%; height: 100%;
		        background: rgba(0,0,0,0.5);
		    ">
	        <div style="
	            background: white;
	            width: 300px;
	            margin: 150px auto;
	            padding: 20px;
	            border-radius: 8px;
		            text-align: center;
	        ">
			<p>この内容で登録しますか？</p>
			<button onclick="submitForm()">OK</button>
			<button onclick="closeModal()">キャンセル</button>
	        </div>
		    </div>

		    <script>
		        function openModal() {
		            document.getElementById("modalOverlay").style.display = "block";
		        }
		        function closeModal() {
		            document.getElementById("modalOverlay").style.display = "none";
		        }
		        function submitForm() {
		            document.getElementById("createForm").submit();
		        }
		    </script>
    </main>
</html>
