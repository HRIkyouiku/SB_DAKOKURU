<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/layout}">
    <main layout:fragment="content">
        <h3>新規部署登録</h3>
        <p th:text="${error}"></p>
            <form method="post" th:action="@{/department/store}" th:object="${departmentForm}">
                <div class="departmentJP">
                    <label>作成する部署名</label>
                    <input type="text" class="createJP" name="nameJp" placeholder="新しい部署名" size="60"/>
                    <p th:if="${#fields.hasErrors('nameJp')}" th:errors="*{nameJp}" class="error-message"></p>
                </div>
                <div class="departmentEN">
                    <label>部署名(英語)</label>
                    <input type="text" class="createEN" name="nameEn" placeholder="新しい部署名(英語)" size="60"/>
                    <p th:if="${#fields.hasErrors('nameEn')}" th:errors="*{nameEn}" class="error-message"></p>
                </div>
                <div>
                   <input type="submit" class="createbutton" value="登録" onclick="return confirm('登録します。宜しいですか？')"/>
                </div>
            </form>
            <a class="indexlink" th:href="@{/department/index}">部署一覧へ戻る</a>
    </main>
</html>
