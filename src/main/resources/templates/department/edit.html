<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org"
	xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head>
	<title>Spring Security Example </title>
</head>

<body>
	<form th:action="@{/department/edit}" th:object="${departmentForm}"　th:method="post">
		<input type="hidden" th:field="*{departmentid}">
		<h1>部署編集・削除</h1>
		<div>
			<label>変更前</label>
			<input type="text" name="nameJp" th:field="*{departmentname_jp}">
			<div th:if="${#fields.hasErrors('departmentname_jp')}" th:errors="*{departmentname_jp}" style="color:red;">
			</div>
			<input type="text" name="nameEn" th:field="*{departmentname_en}">
			<div th:if="${#fields.hasErrors('departmentname_en')}" th:errors="*{departmentname_en}" style="color:red;">
			</div>
		</div>
		<div>
			<label>変更後</label>
			<input type="text" name="nameJp" th:field="*{departmentname_jp}">
			<div th:if="${#fields.hasErrors('departmentname_jp')}" th:errors="*{departmentname_jp}" style="color:red;">
			</div>
		</div>
		<div>
			<label>変更後（英語）</label>
			<input type="text" name="nameEn" th:field="*{departmentname_en}">
			<div th:if="${#fields.hasErrors('departmentname_en')}" th:errors="*{departmentname_en}" style="color:red;">
			</div>
		</div>

		<input type="submit" value="変更">
		<button class="btn btn-primary" type="submit">削除</button>

		<div>
			<a th:href="@{/department/index}">戻る</a>
		</div>
	</form>
</body>

</html>
