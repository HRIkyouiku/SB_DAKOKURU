<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/layout}">
    <main layout:fragment="content">
	    <h2>部署編集・削除</h2>
		<div>
		    <p>変更前
				<input type="text" th:value="${department.nameJp}" readonly>
				<input type="text" th:value="${department.nameEn}" readonly></p>
		</div>	
		<br>		
		
		    <form id="updateForm" th:action="@{/department/update}" method="post" th:object="${DepartmentForm}">
		        <input type="hidden" th:field="*{id}" th:value="${department.id}">
		            <p>変更後
		            <input type="text" th:field="*{name_jp}">
					<span th:if="${#fields.hasErrors('name_jp')}" th:errors="*{name_jp}" style="color:red;"></span>
					</p>
		            <p>変更後（英語）
		            <input type="text" th:field="*{name_en}">
					<span th:if="${#fields.hasErrors('name_en')}" th:errors="*{name_en}" style="color:red;"></span>
					</p>
				<br>
				<div style="display: flex; gap: 10px;">
				    <button type="button" onclick="openUpdateModal()">変更</button>
				</div>
			</form>
			<br>
			<form id="deleteForm" th:action="@{/department/delete}" method="post">
			    <input type="hidden" name="id" th:value="${department.id}">
			    <button type="button" onclick="openDeleteModal()">削除</button>
			</form>

		<br>
		<div>
		  <a th:href="@{/department/index}">部署一覧へ戻る</a>
		</div>
		  <div id="updateModal" style="
	         display:none;
	         position: fixed;
	         top: 0; left: 0;
	         width: 100%; height: 100%;
	         background: rgba(0,0,0,0.5);
	      ">
	      <div style="
	         background: white;
	         width: 300px;
	         margin: 150px auto;
	         padding: 20px;
	         border-radius: 8px;
	         text-align: center;
	      ">
	      <p>この内容で変更しますか？</p>
	      <button onclick="submitUpdate()">OK</button>
	      <button onclick="closeUpdateModal()">キャンセル</button>
	      </div>
	      </div>
	      <div id="deleteModal" style="
	         display:none;
	         position: fixed;
	         top: 0; left: 0;
	         width: 100%; height: 100%;
	         background: rgba(0,0,0,0.5);
	      ">
	      <div style="
	         background: white;
	         width: 300px;
	         margin: 150px auto;
	         padding: 20px;
	         border-radius: 8px;
	         text-align: center;
	      ">
	      <p>本当に削除しますか？</p>
	      <button onclick="submitDelete()">OK</button>
	      <button onclick="closeDeleteModal()">キャンセル</button>
	      </div>
	      </div>
		  
	      <script>
	         function openUpdateModal() {
	             document.getElementById("updateModal").style.display = "block";
	         }
	         function closeUpdateModal() {
	             document.getElementById("updateModal").style.display = "none";
	         }
	         function submitUpdate() {
	             document.getElementById("updateForm").submit();
	         }
	         function openDeleteModal() {
	             document.getElementById("deleteModal").style.display = "block";
	         }
	         function closeDeleteModal() {
	             document.getElementById("deleteModal").style.display = "none";
	         }
	         function submitDelete() {
	             document.getElementById("deleteForm").submit();
	         }
	     </script>
	</main>
</html>
