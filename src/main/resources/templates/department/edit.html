<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/layout}">
    <main layout:fragment="content">
        <h2>部署編集・削除</h2>
            <form method="post" th:action="@{/department/update/{Id}(Id=${departmentRegistrarion.id}}" th:object="${departmentForm}">
                <div>
                    <label>変更前</label>
                    <label th:text="${department.nameJp}"></label>
                    <label th:text="${department.nameEn}"></label>
                </div>
                <div>
                    <label>変更後</label>
                    <input type="text" name="nameJp" th:value="*{nameJp}"/></label>
                    <span th:if="${#fields.hasErrors('nameJp')}" th:errors="*{nameJp}" class="error-message"></span>
                </div>
                <div>
                    <label>変更後(英語)</label>
                    <input type="text" name="nameEn" th:value="*{nameEn}"/></label>
                    <span th:if="${#fields.hasErrors('nameEn')}" th:errors="*{nameEn}" class="error-message"></span>
                </div>
                <div>
                   <input type="submit" value="変更"/>
                   <form method="post" th:action="@{/department/delete/{Id}(Id=${departmentRegistrarion.id}}" th:object="${departmentForm}">
                       <input type="submit" value="削除"/>
                   </form>
                </div>
            </form>
            <a th:href="@{/department/index}">部署一覧へ戻る</a>
    </main>
</html>
