<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/layout}">
<main layout:fragment="content">
<title>部署名編集削除</title>
<body>
	<h2>部署編集・削除</h2>
	<p th:text="${error}"></p>
	<form th:action="@{/department/update}" th:object="${departmentForm}" method="post">
		<input type="hidden" th:name="id" th:value="${department.id}">
		<p>
			<label>変更前</label>
			<span th:text="${department.nameJp}"></span>
			<span th:text="${department.nameEn}"></span>
		</p>
		<p>
			<label for="nameJp">変更後</label>
			<input type="text" th:name="nameJp" id="nameJp" th:value="${department.nameJp}">
			<span th:if="${#fields.hasErrors('nameJp')}" th:errors="*{nameJp}" class="error-message"></span>
			<label for="nameEn">変更後（英語）</label>
			<input type="text" th:name="nameEn" id="nameEn" th:value="${department.nameEn}">
			<span th:if="${#fields.hasErrors('nameEn')}" th:errors="*{nameEn}" class="error-message"></span>
		</p>
		<button type="submit" onclick="return confirm('更新します。宜しいですか？')">変更</button>
	</form>
	<form th:action="@{/department/delete}" method="post">
		<input type="hidden" th:name="id" th:field="${department.id}">
		<button onclick="return confirm('削除します。宜しいですか？')">削除</button>
	</form>
	<a href="/department/index">部署一覧へ戻る</a>
</body>
</html>
