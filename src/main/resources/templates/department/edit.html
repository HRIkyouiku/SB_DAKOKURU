<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/layout}">
    <main layout:fragment="content">
        <h2>部署編集・削除</h2>
            <form method="post" th:action="@{/department/update/{Id}(Id=${department.id})}" th:object="${department}">
                <div>
                    <label>変更前</label>
                    <input type = "text" th:value="${department.nameJp}" readonly>
                    <input type = "text" th:value="${department.nameEn}" readonly>
                </div>
                <div>
                    <label>変更後</label>
                    <input type="text" name="nameJp">
                    <span th:if="${#fields.hasErrors('nameJp')}" th:errors="*{nameJp}" class="error-message"></span>
                </div>
                <div>
                    <label>変更後(英語)</label>
                    <input type="text" name="nameEn">
                    <span th:if="${#fields.hasErrors('nameEn')}" th:errors="*{nameEn}" class="error-message"></span>
                </div>
                <div>
                   <input type="submit" value="変更" onclick="return confirm('更新します。宜しいですか？')"/>
             </form>
                   <form method="post" th:action="@{/department/delete/{Id}(Id=${department.id})}" th:object="${department}">
                       <input type="submit" value="削除" onclick="return confirm('削除します。宜しいですか？')"/>
                   </form>
                </div>
            <a th:href="@{/department/index}">部署一覧へ戻る</a>
    </main>
</html>
