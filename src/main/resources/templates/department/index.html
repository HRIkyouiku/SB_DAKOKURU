<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">

<head>
	<title>Spring Security Example </title>
</head>

<body>
	<form th:action="@{/department/index}" th:method="post">
		<h1>部署一覧</h1>
		<div>
			<label>キーワード</label>
			<input type="text" name="searchName" placeholder="検索したい部署名を入力">
			<button>検索</button>
			<button>クリア</button>
			<input type="button" onclick="location.href='/department/create'" value="部署新規追加">
			<table>
				<tr th:each="department : ${departments}">
					<td th:text="${department.nameJp}"></td>
					<td>
						<a th:href="@{/department/edit/{id}(id=${department.id})}">編集</a>
					</td>
				</tr>
			</table>
		</div>
	</form>
</body>

</html>
