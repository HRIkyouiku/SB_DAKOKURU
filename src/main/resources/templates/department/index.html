<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
	<meta charset="UTF-8">
	<title layout:title-pattern="$CONTENT_TITLE - 打刻システム">部署一覧表示</title>
	<link rel="stylesheet" th:href="@{/css/department/common.css}">
	<link rel="stylesheet" th:href="@{/css/department/department.css}">
</head>

<formbody>

	<div class="page-container">

		<header>
			<h2>部署一覧</h2>
		</header>

		<div th:if="${successMessage}" class="success-message">
			<p th:text="${successMessage}"></p>
		</div>

		<div class="top-bar">

			<form th:action="@{/department/index}" method="post" class="search-area">

				<label class="search-label">キーワード</label>
				<input class="search-box" type="text" name="keyword" placeholder="検索したい部署名を入力">

				<button class="search-btn" type="submit">検索</button>
				<a th:href="@{/department/index}" class="clear-btn">クリア</a>
			</form>

			<div class="action-area">
				<a th:href="@{/department/create}" class="add-btn">部署新規追加</a>
				<a th:href="@{/timestamp/create}" class="back-botton">戻る</a>
			</div>

		</div>

		<div th:if="!${departments}">
			<p>登録された企業はありません。</p>
		</div>


		<div class="result-info" th:block th:if="${keyword != null and !keyword.isEmpty()}">
			<span th:text="'検索結果 ' + ${departments.size()} + '件'"></span>
		</div>

		<table class="department-table">
			<tr th:each="department : ${departments}">
				<td th:text="${department.nameJp}"></td>
				<td>
					<a th:href="@{/department/edit(id=${department.id})}" class="edit-btn">編集</a>
				</td>
			</tr>
		</table>

	</div>
	</div>
	
</body>

</html>
