<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/layout}">
    <main layout:fragment="content">
        <h2>部署一覧</h2>
        <a th:href="@{/department/create}">部署新規追加</a>
            <table>
                <tr th:each="departmentRegistrarion : ${departmentRegistrarion}">
                    <td th:text="${departmentRegistrarion.nameJp}"></td>
                    <td><a th:href="@{/department/edit/{Id}(Id=${departmentRegistrarion.id})}">編集</a></td>
        </table>
    </main>
</html>
