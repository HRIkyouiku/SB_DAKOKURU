<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
	<meta charset="UTF-8">
	<title layout:title-pattern="$CONTENT_TITLE - 打刻システム">部署一覧表示</title>
	<link rel="stylesheet" th:href="@{/css/department.css}">
</head>

<body>

	<div class="page-container">
		<form th:action="@{/department/index}" th:method="post">
			<h2>部署一覧</h2>

			<div class="top-bar">

				<div class="search-area">
					<label>キーワード</label>
					<form th:action="@{/department/search}" method="get">
						<input class="search-box" type="text" name="keyword" placeholder="検索したい部署名を入力">
						<button class="search-btn" type="submit">検索</button>
					</form>


					<div th:if="!${departments}">
						<p>登録された企業はありません。</p>
					</div>

					<button class="clear-btn">クリア</button>

				</div>

				<div class="action-area">
					<input class="add-btn" type="button" onclick="location.href='/department/create'" value="部署新規追加">
				</div>
				
				<a th:href="@{/timestamp/create}" class="back-btn">戻る</a>
			</div>

			<div class="result-info" th:block th:if="${keyword != null and !keyword.isEmpty()}">
				<span th:text="'検索結果 ' + ${departments.size()} + '件'"></span>
			</div>



			<table class="department-table">
				<tr th:each="department : ${departments}">
					<td th:text="${department.nameJp}"></td>
					<td>
						<a th:href="@{/department/edit(id=${department.id})}" class="edit-btn">編集</a>
					</td>
				</tr>
			</table>
			<div th:if="${successMessage}" class="successs-message">
				<p th:text="${successMessage}"></p>
			</div>
	</div>
	</form>
	</div>
</body>

</html>
